<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Todo{% endblock %}</title>
    <style>
        body { font-family: sans-serif; background: #f4f5f7; margin: 0; padding: 30px 16px; }
        .container { max-width: 640px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        h1 { margin-top: 0; }
        a { color: #2d6cdf; text-decoration: none; }
        .btn { display: inline-block; padding: 6px 12px; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; color: #fff; background: #2d6cdf; }
        .btn-gray { background: #888; }
        .btn-red { background: #d9534f; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #e6f4ea; color: #1e7b34; padding: 8px 12px; border-radius: 4px; margin-bottom: 8px; }

        .todo-list { list-style: none; padding: 0; }
        .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #e3e3e3; border-radius: 6px; margin-bottom: 8px; }
        .todo-item .body { flex: 1; }
        .todo-item .meta { font-size: 12px; color: #999; }
        .todo-item .content { font-size: 14px; color: #555; margin: 4px 0; white-space: pre-line; }
        /* 완료된 항목: 취소선 + 배경색 */
        .todo-item.completed { background: #eef7ee; }
        .todo-item.completed .title,
        .todo-item.completed .content { text-decoration: line-through; color: #999; }
        .check-btn { width: 24px; height: 24px; border: 2px solid #2d6cdf; border-radius: 50%; background: #fff; cursor: pointer; color: #fff; font-size: 14px; line-height: 1; }
        .completed .check-btn { background: #2d6cdf; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; }
        .form-group input[type=text], .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .form-group.has-error input, .form-group.has-error textarea { border-color: #d9534f; }
        .errorlist { color: #d9534f; list-style: none; padding: 0; margin: 4px 0 0; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    {% if messages %}
        <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
