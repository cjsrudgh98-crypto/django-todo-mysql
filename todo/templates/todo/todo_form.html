{% extends 'todo/base.html' %}

{% block title %}할 일 {{ mode }}{% endblock %}

{% block content %}
<h1>할 일 {{ mode }}</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="form-group{% if form.title.errors %} has-error{% endif %}">
        <label for="{{ form.title.id_for_label }}">{{ form.title.label }} *</label>
        {{ form.title }}
        {{ form.title.errors }}
    </div>

    <div class="form-group{% if form.content.errors %} has-error{% endif %}">
        <label for="{{ form.content.id_for_label }}">{{ form.content.label }}</label>
        {{ form.content }}
        {{ form.content.errors }}
    </div>

    <div class="form-group">
        <label>{{ form.is_completed }} {{ form.is_completed.label }}</label>
    </div>

    <button type="submit" class="btn">{{ mode }}</button>
    <a class="btn btn-gray" href="{% url 'todo:list' %}">취소</a>
</form>
{% endblock %}
